[project]
name = "simplelogin-mcp"
version = "0.1.0"
description = "MCP server for alias management via the SimpleLogin API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=2,<3"]

[project.scripts]
simplelogin-mcp = "simplelogin_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simplelogin_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
